name: navalert
description: "NavAlert: adaptive destination alarm, route/fare commute guide, and emergency safety system for Metro Manila PUV commuters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State / MVVM
  provider: ^6.1.2

  # Local storage — SQLite with SQLCipher AES-256 encryption (paper: Development Tools).
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.4

  # Simple key-value prefs (non-sensitive UI toggles, e.g. map dark mode) —
  # kept separate from the encrypted SQLCipher store on purpose.
  shared_preferences: ^2.3.2

  # Networking (Nominatim geocoding)
  http: ^1.2.2

  # Maps (OpenStreetMap tiles)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS speed
  geolocator: ^13.0.1

  # Google Maps intent / external launch
  url_launcher: ^6.3.0

  # Permissions
  permission_handler: ^11.3.1

  # IDs
  uuid: ^4.5.1

  # Injectable clock (real time in prod, virtual under fakeAsync in tests) —
  # lets the "Signal Lost" watchdog be tested without waiting real seconds.
  clock: ^1.1.1

  # Alarm feedback
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  record: ^6.0.0
  flutter_local_notifications: ^17.2.3

  cupertino_icons: ^1.0.8
  home_widget: ^0.9.3
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a device/emulator for the ghost-user UI sweep
  # (integration_test/full_app_sweep_test.dart).
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Virtual clock for testing the time-based alarm escalation / watchdog timers.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/gtfs/routes.json.gz
    # UI/UX images — one folder per area. Add a line here for each NEW
    # subfolder you create under assets/images/ (Flutter doesn't auto-scan
    # nested folders). 'reference/' is intentionally NOT listed: kept in the
    # repo for design reference but excluded from the APK.
    - assets/images/tutorial/
    - assets/images/branding/
    - assets/icons/
    - assets/images/transport/
    - assets/images/alarm/
