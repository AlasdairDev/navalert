org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# DO NOT MODIFY LOGIC: Kotlin incremental compilation is disabled deliberately.
# The pub cache lives on C: while this project lives on D:, and the Kotlin
# incremental cache stores RELATIVE paths - it cannot relativise a plugin
# source on one drive against a project root on another. Every build therefore
# printed "Could not close incremental caches ... class-fq-name-to-source.tab"
# errors for the plugin modules (home_widget, record_android). The APK was
# still correct, but that noise buries genuine compile errors, which is exactly
# how a real break goes unnoticed. Removing the cache removes the errors;
# release builds are full recompiles anyway, so only rebuild speed is traded.
kotlin.incremental=false
